buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.requiem.servants'
archivesBaseName = 'goety-request-systems'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                requiem {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                requiem {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://cursemaven.com' }
    // GeckoLib (goety 的运行时依赖，仅在需要时使用)
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // 本地 goety 开发 jar（把 deobf 后的 goety jar 放到 libs/ 下）
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Goety：二选一
    // 方式 A：本地 libs（推荐，离线可用）。把 goety-2.5.57.3 的 deobf/dev jar 丢进 libs/ 目录
    //   fg.deobf 会把 SRG 映射的 jar 重映射为 Mojang，从而可以编译。
    implementation fg.deobf(files('libs/goety-2.5.57.3.jar'))

    // 方式 B：CurseMaven（需要联网，且要填准确的 projectId/fileId）
    // implementation fg.deobf("curse.maven:goety-<projectId>:<fileId>")

    // GeckoLib（本项目只用 goety 的原版渲染器，通常不需要；若编译报缺 GeckoLib 类再取消注释）
    // implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7")
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "goetyrequests",
            "Specification-Vendor"    : "requiem",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "requiem",
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
